version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: liana_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: liana_db
      MYSQL_USER: liana_user
      MYSQL_PASSWORD: liana_password
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./packages/backend/src/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: liana_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: liana_user
      DB_PASSWORD: liana_password
      DB_NAME: liana_db
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    container_name: liana_frontend
    restart: unless-stopped
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mysql-data:
